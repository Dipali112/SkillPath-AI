<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign up — SkillPath AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header id="site-header"></header>

  <main class="auth-page">
    <div class="auth-card">
      <h1>Create your account</h1>
      <p class="sub">Free forever. Get your skill roadmap in minutes.</p>

      <form id="signup-form" novalidate>
        <div class="form-group">
          <label for="name">Full name</label>
          <input type="text" id="name" name="name" autocomplete="name" placeholder="Dipali Sharma" />
          <div class="form-error" data-error-for="name"></div>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" placeholder="you@example.com" />
          <div class="form-error" data-error-for="email"></div>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="new-password" placeholder="At least 8 characters" />
          <div class="form-error" data-error-for="password"></div>
        </div>
        <div class="form-group">
          <label for="confirm">Confirm password</label>
          <input type="password" id="confirm" name="confirm" autocomplete="new-password" placeholder="Type it again" />
          <div class="form-error" data-error-for="confirm"></div>
        </div>
        <div class="form-error" id="form-message"></div>
        <button class="btn btn-primary btn-block btn-lg" type="submit">Create my account</button>
      </form>

      <div class="divider">Already have an account?</div>
      <a class="btn btn-outline btn-block" href="login.html">Log in</a>
    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
