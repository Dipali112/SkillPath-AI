<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Explore IT roles — SkillPath AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header id="site-header"></header>

  <main>
    <section class="page-head">
      <div class="container">
        <h1 style="font-size:clamp(1.8rem,3vw,2.6rem)">Explore IT roles</h1>
        <p class="muted">See the skills each role needs, in the order you should learn them.</p>
        <form class="search-box" id="role-search" role="search" style="max-width:640px">
          <input type="search" id="search-input" placeholder="Search by role or skill, e.g. React" aria-label="Search roles" />
          <button class="btn btn-primary" type="submit">Search</button>
        </form>
      </div>
    </section>

    <div class="container layout-sidebar">
      <!-- Filters -->
      <aside class="sidebar" aria-label="Filters">
        <h4>Category</h4>
        <ul class="filter-list" id="category-filters"></ul>
        <h4>Number of skills</h4>
        <ul class="filter-list">
          <li><label><input type="radio" name="size" value="all" checked /> Any</label></li>
          <li><label><input type="radio" name="size" value="7" /> 7 or fewer</label></li>
          <li><label><input type="radio" name="size" value="8" /> 8 skills</label></li>
        </ul>
      </aside>

      <!-- Results -->
      <section>
        <p class="muted" id="result-count" style="margin-bottom:12px"></p>
        <div class="listing" id="role-list"></div>
      </section>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/roles.js"></script>
</body>
</html>
