<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — SkillPath AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header id="site-header"></header>

  <main class="auth-page">
    <div class="auth-card">
      <h1>Log in to SkillPath</h1>
      <p class="sub">Welcome back! Pick up where you left off.</p>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" placeholder="you@example.com" />
          <div class="form-error" data-error-for="email"></div>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Your password" />
          <div class="form-error" data-error-for="password"></div>
        </div>
        <div class="form-error" id="form-message"></div>
        <button class="btn btn-primary btn-block btn-lg" type="submit">Log in</button>
      </form>

      <div class="divider">New to SkillPath?</div>
      <a class="btn btn-outline btn-block" href="signup.html">Create an account</a>
    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
